<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webnovel Helper v2.0</title>
    <style>
      :root {
        --primary: #1677ff;
        --danger: #ff4d4f;
        --bg: #f5f5f5;
        --text: #333;
        --border: #d9d9d9;
      }

      body {
        width: 400px;
        padding: 0;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: #fff;
        color: var(--text);
      }

      /* Tabs */
      .tabs {
        display: flex;
        background: #fafafa;
        border-bottom: 1px solid var(--border);
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        border: none;
        background: none;
        cursor: pointer;
        font-weight: 500;
        color: #666;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
      }
      .tab-btn:hover {
        background: #f0f0f0;
      }
      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        background: #fff;
      }

      /* Content Area */
      .tab-content {
        display: none;
        padding: 16px;
        animation: fadeIn 0.2s;
      }
      .tab-content.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Form Elements */
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        font-size: 13px;
        color: #555;
      }
      input[type='text'],
      input[type='number'],
      input[type='file'],
      input[type='datetime-local'] {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
      }
      input[type='file'] {
        padding: 6px;
      }

      select {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
      }

      /* Rich Text Editor Placeholder */
      .rich-editor {
        width: 100%;
        min-height: 100px;
        max-height: 200px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow-y: auto;
        font-family: inherit;
        white-space: pre-wrap;
        outline: none;
      }
      .rich-editor:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.2);
      }
      .editor-toolbar {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
      }
      .tool-btn {
        padding: 2px 6px;
        font-size: 12px;
        cursor: pointer;
        background: #eee;
        border: 1px solid #ddd;
        border-radius: 2px;
      }

      /* Buttons */
      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s;
        font-size: 14px;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: #4096ff;
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger:hover {
        background: #ff7875;
      }

      .status-bar {
        margin-top: 16px;
        padding: 10px;
        background: #f6f6f6;
        border-radius: 4px;
        font-size: 12px;
        color: #666;
        border: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="templates">Templates</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <!-- Dashboard Tab -->
    <div id="dashboard" class="tab-content active">
      <div class="form-group">
        <label for="files">Upload Chapters (Select Files or Folder)</label>
        <input type="file" id="files" multiple webkitdirectory />
        <div
          id="file-count"
          style="font-size: 12px; color: #888; margin-top: 4px"
        >
          No files selected
        </div>
      </div>

      <div class="form-group">
        <label>Target Novel</label>
        <input
          type="text"
          id="targetNovel"
          placeholder="Novel Title or ID (Optional)"
        />
      </div>

      <div class="form-group" style="border-top: 1px solid #eee; padding-top: 10px;">
        <label>Scheduling (Optional)</label>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <div style="flex: 1;">
            <label style="font-size: 11px;">Start Time</label>
            <input type="datetime-local" id="schedStart" />
          </div>
          <div style="width: 80px;">
             <label style="font-size: 11px;">Batch Size</label>
             <input type="number" id="schedBatch" value="1" min="1" />
          </div>
        </div>
        <div style="display: flex; gap: 8px;">
           <div style="flex: 1;">
              <label style="font-size: 11px;">Interval</label>
              <input type="number" id="schedInterval" value="24" min="1" />
           </div>
           <div style="flex: 1;">
              <label style="font-size: 11px;">Unit</label>
              <select id="schedUnit">
                <option value="60">Minutes</option>
                <option value="3600" selected>Hours</option>
                <option value="86400">Days</option>
              </select>
           </div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button id="startBtn" class="btn btn-primary">Start Upload</button>
        <button id="stopBtn" class="btn btn-danger">Stop</button>
      </div>

      <div id="status" class="status-bar">Status: Idle</div>
    </div>

    <!-- Templates Tab -->
    <div id="templates" class="tab-content">
      <div class="form-group">
        <label>Prefix Template</label>
        <div class="editor-toolbar">
          <button class="tool-btn" data-cmd="bold">B</button>
          <button class="tool-btn" data-cmd="italic">I</button>
        </div>
        <div id="prefixEditor" class="rich-editor" contenteditable="true"></div>
      </div>

      <div class="form-group">
        <label>Suffix Template</label>
        <div class="editor-toolbar">
          <button class="tool-btn" data-cmd="bold">B</button>
          <button class="tool-btn" data-cmd="italic">I</button>
        </div>
        <div id="suffixEditor" class="rich-editor" contenteditable="true"></div>
      </div>

      <button id="saveTemplatesBtn" class="btn btn-primary">
        Save Templates
      </button>
      <div
        id="templateStatus"
        style="margin-top: 8px; font-size: 12px; color: green; min-height: 18px"
      ></div>
    </div>

    <!-- Settings Tab -->
    <div id="settings" class="tab-content">
      <div class="form-group">
        <label for="patreonUrl">Patreon URL</label>
        <input
          type="text"
          id="patreonUrl"
          placeholder="https://www.patreon.com/..."
        />
      </div>

      <button id="saveSettingsBtn" class="btn btn-primary">
        Save Settings
      </button>
      <div
        id="settingsStatus"
        style="margin-top: 8px; font-size: 12px; color: green; min-height: 18px"
      ></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
